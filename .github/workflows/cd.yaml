name: cd

on:
  workflow_run:
    workflows: [ "ci" ]
    types:
      - completed

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup nvm
        uses: actions/setup-node@v3
        with:
          node-version-file: .nvmrc

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run lint
        run: bun run lint

      - name: Build frontend
        run: bun run build

      - name: Upload dist as artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/

  deploy:
    name: deploy
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/

      - name: Checkout deploy repo
        uses: actions/checkout@v3
        with:
          repository: keenywheels/deploy
          path: deploy

      - name: Setup ssh key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_KEY }}

      - name: Copy frontend to server
        run: ansible-playbook -i deploy/inventory/hosts.ini deploy/playbooks/deploy-front.yaml
        env:
          ANSIBLE_HOST_KEY_CHECKING: False
          VIXAR_DIST_PATH: ${{ github.workspace }}/dist
